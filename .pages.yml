media:
  input: media
  output: /media

content:
  - name: journal
    label: Estate Journal
    type: collection
    path: content/journal
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: category
        label: Category
        type: select
        options:
          values:
            - name: Wildlife Diaries
              value: Wildlife Diaries
            - name: Agriculture & AI
              value: Agriculture & AI
            - name: The Farm
              value: The Farm
            - name: Coexistence
              value: Coexistence
            - name: Our Days Here
              value: Our Days Here
      - name: cover
        label: Cover photograph
        type: image
      - name: excerpt
        label: Short introduction
        type: text
      - name: body
        label: Story
        type: rich-text
